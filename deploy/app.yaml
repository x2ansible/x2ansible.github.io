---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x2a-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: x2a-role
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete", "put"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete", "put"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: x2a-rolebinding
subjects:
  - kind: ServiceAccount
    name: x2a-sa
roleRef:
  kind: Role
  name: x2a-role
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole/ClusterRoleBinding for x2a-sa to pass the plugin's connection test
# which hardcodes a pod list call against the 'default' namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: x2a-cluster-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: x2a-cluster-rolebinding
subjects:
  - kind: ServiceAccount
    name: x2a-sa
    namespace: x2ansible
roleRef:
  kind: ClusterRole
  name: x2a-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
# X2A Backstage Plugin Application Resources
# Apply to any namespace using: oc apply -n <your-namespace> -f app.yaml
#
# ConfigMap: Dynamic Plugins Configuration
kind: ConfigMap
apiVersion: v1
metadata:
  name: dynamic-plugins
  # namespace field intentionally omitted - use -n flag when applying
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      # Upstream @backstage/plugin-auth frontend providing the /oauth2/* consent page for DCR.
      # Replaces the x2a-dcr workaround used in RHDH 1.9. Still needed in RHDH 1.10
      - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth:bs_1.49.4__0.1.6"

      # Custom build of mcp-actions-backend based on version 0.1.11, patched for:
      #   https://github.com/backstage/backstage/issues/33062
      #
      # The fix landed in mcp-actions-backend 0.1.12-next.2 (see CHANGELOG) but 0.1.12 has not
      # been included in a stable Backstage release yet.
      # RHDH 1.10 is based on Backstage 1.49.4 which ships mcp-actions-backend 0.1.11 (without the fix).
      # RHDH does not bundle mcp-actions-backend natively - it must be installed as a dynamic plugin.
      #
      # Following patched image was built from: https://github.com/redhat-developer/rhdh-plugin-export-overlays/pull/2236
      # It works in both RHDH 1.9 (Backstage 1.45.3) and RHDH 1.10 (Backstage 1.49.4).
      # TODO: Replace with the upstream overlay build once a stable Backstage release includes
      #       mcp-actions-backend >= 0.1.12 and a matching RHDH overlay image is published.
      # Expected time frame: RHDH 1.11 or RHDH 2.0
      - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:pr_2236__0.1.11"

      # Enable backstage-plugin-scaffolder-backend-module-github-dynamic plugin which is disabled by default for better github integration
      - package: './dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic'
        disabled: false

      # All X2A plugins
      - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-x2a:bs_1.49.4__2.0.0"
      - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-x2a-backend:bs_1.49.4__2.0.0"
      - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-x2a-mcp-extras:bs_1.49.4__1.0.0"
      - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-x2a-scaffolder-module:bs_1.49.4__2.0.0"

---
# ConfigMap: Application Configuration
kind: ConfigMap
apiVersion: v1
metadata:
  name: app-config-rhdh
data:
  app-config-rhdh.yaml: |

    app:
      extensions:
        - 'api:app/app-language':
            config:
              defaultLanguage: en
              availableLanguages:
                - en
                - de
                - es
                - fr
                - it

    backend:
      cors:
        origin:
          # for @modelcontextprotocol/inspector, remove if not needed
          - http://localhost:6274
        credentials: true
      actions:
        pluginSources:
          - 'x2a-mcp-extras'
      reading:
        allow:
          - host: raw.githubusercontent.com

    # Disable namespaced tool names for MCP actions
    # Workaround for recent MCP server returning `undefined` for tool namespaces
    # Will be solved by later @backstage/backend-defaults.
    mcpActions:
      namespacedToolNames: false

    integrations:
      github:
        - host: github.com
      # CUSTOMIZE:
      # gitlab:
      #   - host: gitlab.com
      #   - host: gitlab.internal.io # Self-hosted GitLab
      #     apiBaseUrl: https://gitlab.internal.io/api/v4
      # bitbucketCloud:
      #   - host: bitbucket.org

    auth:
      experimentalDynamicClientRegistration:
        # enable the feature
        enabled: true
        allowedRedirectUriPatterns:
          - cursor://*
          # CUSTOMIZE:
          - https://*
          - http://*

      # see https://backstage.io/docs/auth/ to learn about auth providers
      environment: development
      providers:
        # See https://backstage.io/docs/auth/guest/provider
        # guest: {}

        # CUSTOMIZE:
        github:
          development:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
                  dangerouslyAllowSignInWithoutUserInCatalog: true
        # Bitbucket example for authentication
        # bitbucket:
        #   development:
        #     clientId: ${AUTH_BITBUCKET_CLIENT_ID:-}
        #     clientSecret: ${AUTH_BITBUCKET_CLIENT_SECRET:-}
        #     signIn:
        #       resolvers:
        #         # The usernameMatchingUserEntityName resolver is not working for Bitbucket.
        #         # Cannot make the bitbucket to provide user's email.
        #         # See the org.yaml file for an example of how to use the usernameMatchingUserEntityAnnotation resolver.
        #         - resolver: usernameMatchingUserEntityAnnotation
        #           dangerouslyAllowSignInWithoutUserInCatalog: true

        # Gitlab example for authentication
        # gitlab:
        #   development:
        #     clientId: ${AUTH_GITLAB_CLIENT_ID}
        #     clientSecret: ${AUTH_GITLAB_CLIENT_SECRET}
        #     signIn:
        #       resolvers:
        #         - resolver: usernameMatchingUserEntityName
        #           dangerouslyAllowSignInWithoutUserInCatalog: true
    signInPage:
      - github
      # - gitlab
      # - bitbucket
    dynamicPlugins:
      frontend:
        backstage.plugin-auth:
          dynamicRoutes:
            - path: /oauth2/*
              importName: Router

        red-hat-developer-hub.backstage-plugin-x2a:
          scaffolderFieldExtensions:
            - importName: RepoAuthenticationExtension
            - importName: RulesAcceptanceExtension
          translationResources:
            - importName: x2aPluginTranslations
              ref: x2aPluginTranslationRef
          appIcons:
            - name: x2aIcon
              importName: X2AIcon
          dynamicRoutes:
            - path: /x2a
              importName: X2APage
              menuItem:
                text: Conversion Hub
                icon: x2aIcon

    catalog:
      locations:
        # x2a Create Project template
        - type: file
          target: /opt/app-root/src/dynamic-plugins-root/red-hat-developer-hub-backstage-plugin-x2a-scaffolder-module/templates/conversion-project-template.yaml
          rules:
            - allow: [Template]
        # CUSTOMIZATION: Remove or update per your organization and identity provider configured above
        #- type: url
        #  target: https://raw.githubusercontent.com/[your-org]/org.yaml
        #  rules:
        #    - allow: [User, Group]

    # CUSTOMIZATION: see https://backstage.io/docs/permissions/getting-started for more on the permission framework
    #permission:
    #  # Set to false to disable RBAC checks
    #  enabled: true
    #  rbac:
    #    policies-csv-file: ../../examples/example-rbac-policy.csv
    #    policyFileReload: true
    #    pluginsWithPermission:
    #      - x2a
    #    admin:
    #      users:
    #        - name: user:default/[your-user]

    x2a:
      callbackBaseUrl: http://${SERVICE_NAME}.${NAMESPACE}.svc.cluster.local/api/x2a
      kubernetes:
        image: ${X2A_KUBERNETES_IMAGE:-quay.io/x2ansible/x2a-convertor}
        imageTag: ${X2A_KUBERNETES_IMAGE_TAG:-latest}
        ttlSecondsAfterFinished: 86400
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
      credentials:
        llm:
          LLM_MODEL: ${LLM_MODEL:-anthropic.claude-v2}
          # Example for AWS Bedrock with bearer token:
          AWS_REGION: ${AWS_REGION}
          AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK}
        aap:
          url: ${AAP_URL:-https://aap.example.com}
          orgName: ${AAP_ORG_NAME:-MyOrganization}
          oauthToken: ${AAP_OAUTH_TOKEN:-your-oauth-token}
          skipSSLVerification: ${AAP_SKIP_SSL_VERIFICATION:-false}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: dynamic-plugins-root
spec:
  accessModes:
    - ReadWriteOnce
  # CUSTOMIZATION: Change storage class for your environment
  # Common values:
  #   - OpenShift CRC: crc-csi-hostpath-provisioner
  #   - AWS EBS: gp2 or gp3
  #   - Azure: managed-premium
  #   - GCP: standard or standard-rwo
  # List available storage classes: oc get storageclass
  # storageClassName: kubevirt-csi-infra-default
  storageClassName: crc-csi-hostpath-provisioner
  # storageClassName: hostpath-csi
  resources:
    requests:
      storage: 2Gi
---
apiVersion: rhdh.redhat.com/v1alpha4
kind: Backstage
metadata:
  name: developer-hub
spec:
  deployment:
    patch:
      spec:
        template:
          spec:
            serviceAccountName: x2a-sa
            automountServiceAccountToken: true
            containers:
              - name: backstage-backend
                env:
                  - name: NODE_EXTRA_CA_CERTS
                    value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  - name: NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  - name: SERVICE_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.labels['rhdh.redhat.com/app']
  application:
    dynamicPluginsConfigMapName: dynamic-plugins
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: app-config-rhdh
    extraFiles:
      mountPath: /opt/app-root/src
    extraEnvs:
      secrets:
        - name: x2a-credentials
    route:
      enabled: true
